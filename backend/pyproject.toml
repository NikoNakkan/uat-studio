[project]
name = "uat-studio"
version = "0.1.0"
description = "UAT Studio: UAT runs from an Excel file with AI agents and Playwright"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "C4", "PIE", "RUF", "RET", "PTH", "PL"]
ignore = [
  "B008",     # FastAPI's File(...) / Form(...) defaults
  "PLR2004",  # magic values: HTTP status codes and exit codes read better as numbers
  "PLC0414",  # "x as x" is the explicit re-export idiom (kit re-exports processes)
]

[tool.ruff.lint.pylint]
max-args = 7      # keyword-only arguments (run_agent's channel, agent, system, prompt, tools, stage, max_turns)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]   # tests import inside a test to keep each one self-contained

[tool.pytest.ini_options]
testpaths = ["tests"]
